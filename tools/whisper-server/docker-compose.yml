services:
  whisper:
    build: .
    ports:
      # The API has no authentication, so it listens on this machine only by
      # default. If tr-engine runs on another host (or in a container that
      # can't reach the host's loopback), set WHISPER_BIND_IP to a LAN/VPN
      # address, e.g. WHISPER_BIND_IP=192.168.1.20 docker compose up -d
      - "${WHISPER_BIND_IP:-127.0.0.1}:8000:8000"
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - DEVICE=${DEVICE:-auto}
      - COMPUTE_TYPE=${COMPUTE_TYPE:-float16}
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
