# Mosquitto config for the bundled broker (docker-compose.yml / docker-compose.full.yml).
#
# Every client must log in. Create mosquitto/passwd next to this file before
# starting the stack (see docs/docker.md), using the same username/password as
# MQTT_USERNAME / MQTT_PASSWORD in .env and in trunk-recorder's MQTT plugin.
# Never set allow_anonymous to true on a broker that is reachable from a network.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
